[package]
name = "ckt-v4-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compact deterministic CPU reference kernel for CKT v4 competition"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = "0.11.1"

[dev-dependencies]
approx = "0.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
